<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — AFFIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,800;0,900;1,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="subpage-header">
  <a class="back-link" href="index.html">&larr; Till menyn</a>
</div>
<h1 class="page-title">Quiz: Gissa betydelsen</h1>

<section class="view active" style="max-width:980px;margin:1.2rem auto 0;padding:0 1.2rem 4rem;">
  <div class="quiz-top">
    <div class="quiz-stats">
      Fråga <span id="qNum">1</span> &nbsp;·&nbsp; Rätt: <span id="qScore">0</span>/<span id="qTotal">0</span> &nbsp;·&nbsp; Serie: <span id="qStreak">0</span>
    </div>
    <div class="quiz-filter" id="quizFilter">
      <button class="chip active" data-cat="alla">Alla</button>
      <button class="chip" data-cat="prefix">Prefix</button>
      <button class="chip" data-cat="suffix">Suffix</button>
    </div>
  </div>

  <div class="quiz-stage">
    <p class="quiz-prompt" id="quizKatLabel">Prefix</p>
    <div class="term-block prefix" id="quizTerm" data-kat="">…</div>
    <p class="question-text">Vad betyder detta?</p>
    <div class="options" id="quizOptions"></div>
    <div id="quizFeedback"></div>
    <button class="next-btn" id="nextBtn" style="display:none;">Nästa fråga →</button>
  </div>
</section>

<footer>AFFIX · 303 ordbyggarklossar samlade på ett ställe</footer>

<script src="data.js"></script>
<script src="quiz.js"></script>
</body>
</html>
